name: build and publish

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency: "publish-eco-events"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notify_failed: ${{ steps.notify.outputs.NOTIFY_FAILED }}
      notify_failed_channels: ${{ steps.notify.outputs.NOTIFY_FAILED_CHANNELS }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
          
      - name: Run tests
        run: PYTHONPATH=. pytest
          
      - name: Run pipeline build
        run: |
          mkdir -p public data
          python -m gu_eco_events build --live --state data/state.json --out-dir public
          
      - name: Leak check
        env:
          ECO_EVENTS_DISCORD_WEBHOOK_URL: ${{ secrets.ECO_EVENTS_DISCORD_WEBHOOK_URL }}
        run: python -m gu_eco_events check-leaks --tracked --env ECO_EVENTS_DISCORD_WEBHOOK_URL public data
          
      - name: Run pipeline notify
        id: notify
        env:
          ECO_EVENTS_DISCORD_WEBHOOK_URL: ${{ secrets.ECO_EVENTS_DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          python -m gu_eco_events notify --events public/events.json --state data/state.json --mode send | tee "$RUNNER_TEMP/notify.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ] && [ $code -ne 4 ]; then exit $code; fi
          if [ $code -eq 4 ]; then
            # Channel names only (from the summary line); never webhook values.
            failed=$(python -c 'import json,sys; print(",".join([d for d in (json.loads(l) for l in open(sys.argv[1]) if l.startswith("{")) if "failed_channels" in d][-1]["failed_channels"]))' "$RUNNER_TEMP/notify.log") || failed=unknown
            echo "NOTIFY_FAILED=1" >> $GITHUB_OUTPUT
            echo "NOTIFY_FAILED_CHANNELS=$failed" >> $GITHUB_OUTPUT
            echo "Notification delivery failed for: $failed (other channels delivered; undelivered notices stay pending)." >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Commit state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Fail if notify failed
        if: needs.build.outputs.notify_failed == '1'
        env:
          FAILED_CHANNELS: ${{ needs.build.outputs.notify_failed_channels }}
        run: |
          echo "Notification delivery failed for: ${FAILED_CHANNELS:-unknown channel}. State and feed are published; undelivered notices stay pending for the next run."
          exit 1
